services:
  db:
    image: mysql:5.7
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network
    profiles:
      - prestashop
      - tests

  prestashop:
    image: prestashop/prestashop:8.1.5
    container_name: prestashop
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      DB_PREFIX: ps_
      PS_INSTALL_AUTO: "1"
      PS_LANGUAGE: "en"
      PS_COUNTRY: "US"
      PS_DEV_MODE: "1"
      PS_DOMAIN: "prestashop"
      ADMIN_MAIL: "admin@example.com"
      ADMIN_PASSWD: "Admin123!"
      PS_FOLDER_ADMIN: "administration"
      PS_FOLDER_INSTALL: "install"
    volumes:
      - ps_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - app_network
    profiles:
      - prestashop
      - tests

  prestashop_postinstall:
    image: alpine:3.19
    container_name: prestashop_postinstall
    restart: "no"
    depends_on:
      prestashop:
        condition: service_healthy
    volumes:
      - ps_data:/var/www/html
    command: >
      sh -lc '
        apk add --no-cache curl >/dev/null 2>&1 || true;
        echo "Waiting for PrestaShop HTTP to respond...";
        until curl -fsS http://prestashop/ >/dev/null; do sleep 5; done;
        echo "Waiting for config to exist...";
        until [ -f /var/www/html/config/settings.inc.php ] || [ -f /var/www/html/app/config/parameters.php ]; do sleep 2; done;
        echo "Extra grace period...";
        sleep 15;
        echo "Removing install folders...";
        rm -rf /var/www/html/install /var/www/html/install-dev || true;
        echo "Clearing cache...";
        rm -rf /var/www/html/var/cache/* || true;
        echo "Done."
      '
    networks:
      - app_network
    profiles:
      - prestashop

  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.40
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./browsers.json:/etc/selenoid/browsers.json
    command: >
      -conf /etc/selenoid/browsers.json
      -container-network app_network
      -limit 10
      -service-startup-timeout 5m
      -timeout 5m
      -video-output-dir /opt/selenoid/video
      -log-output-dir /opt/selenoid/logs
    networks:
      - app_network
    profiles:
      - tests

  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    container_name: selenoid-ui
    restart: unless-stopped
    command: ["--selenoid-uri", "http://selenoid:4444"]
    networks:
      - app_network
    profiles:
      - tests

  nginx:
    image: nginx:alpine
    container_name: selenoid_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - selenoid
      - selenoid-ui
    networks:
      - app_network
    profiles:
      - tests

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pytest_runner
    restart: "no"
    depends_on:
      prestashop:
        condition: service_healthy
      nginx:
        condition: service_started
    environment:
      - BASE_URL=http://prestashop:80/
    command:
      - "tests/"
      - "-v"
      - "--browser=${BROWSER:-chrome}"
      - "--browser_version=${BROWSER_VERSION:-128.0}"
      - "--executor=selenoid"
      - "--base-url=http://prestashop:80/"
      - "--alluredir=/app/allure-results"
    volumes:
      - ./:/app
      - ./allure-results:/app/allure-results
    networks:
      - app_network
    profiles:
      - tests

networks:
  app_network:
    external: true
    name: app_network

volumes:
  db_data:
  ps_data: